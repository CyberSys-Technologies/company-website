<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberSys Technologies | Resilient Enterprise Infrastructure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#2082A6',
                secondary: '#01CBAE',
                accent: '#524096',
                surface: '#FFFFFF',
                subtle: '#F8FAFC',
                text: '#0F172A',
                muted: '#475569',
              }
            },
            animation: {
              'reveal-up': 'revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 4s ease-in-out infinite',
              'marquee': 'marquee 30s linear infinite',
            },
            keyframes: {
              revealUp: {
                '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-20px) rotate(1deg)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.1' },
                '50%': { opacity: '0.3' },
              },
              scan: {
                '0%': { top: '0%' },
                '100%': { top: '100%' }
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FFFFFF;
        color: #0F172A;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }
      .blueprint-grid {
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(32, 130, 166, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(32, 130, 166, 0.05) 1px, transparent 1px);
      }
      .blueprint-grid-fine {
        background-size: 15px 15px;
        background-image: 
          linear-gradient(to right, rgba(32, 130, 166, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(32, 130, 166, 0.03) 1px, transparent 1px);
      }
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .reveal-on-scroll.active {
        opacity: 1;
        transform: translateY(0);
      }
      .corporate-card {
        background: #FFFFFF;
        border: 1px solid rgba(15, 23, 42, 0.05);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .corporate-card:hover {
        border-color: #2082A6;
        box-shadow: 0 20px 40px -15px rgba(32, 130, 166, 0.1);
        transform: translateY(-4px);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #F8FAFC; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
